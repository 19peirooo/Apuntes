<!DOCTYPE html>
<html>
	<head>
		<meta charset = "utf-8">
	</head>
	<body>
		<form>
			<h1> Tipo Texto </h1>
			<b><p>Usuario:</p></b>
				<input type="text" id="usuario">	
				<br><b><p>Contraseña:</p></b>
				<input type="password" id="passwd">
			<h1> Tipo Radio</h1>
				<input type="radio" id = "red"><i>Rojo</i><br>
				<input type="radio" id = "green"><i>Verde</i><br>
				<input type="radio" id = "blue"><i>Azul</i><br>
			<h1>Tipo Checkbox</h1>
				<input type="checkbox" id="check1"><i>Opcion 1</i><br>
				<input type="checkbox" id="check2"><i>Opcion 2</i><br>
			<h1>Tipo Select</h1>
				<select id = "company">
					<option value = "ford">Ford Motor Company</option>
					<option value = "generalm">General Motors</option>
					<option value = "honda">Honda Motor Company</option>
				</select>
			<h1>Tipo Button</h1>
				<input type="button" value="Enviar" onclick="test()">
		</form>
	</body>
</html>
