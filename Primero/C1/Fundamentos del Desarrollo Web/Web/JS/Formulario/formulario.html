<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Formulario</title>
        <link href="formulario.css" rel="stylesheet" type="text/css">
        <script src="formulario.js" type="text/javascript"></script>
    </head>
    <body>
        <main>
            <form>
                <h1>Registrar Usuario</h1>
                <p>Usuario:</p>
                <input id="usuario" type="text" required>
                <p>Nombre:</p>
                <input id="nombre" type="text" required>
                <p>Apellidos:</p>
                <input id="apellido" type="text" required>
                <p>Email:</p>
                <input id="email" type="email" required>
                <p>Contraseña:</p>
                <input id="passwd" type="password" required>
                <p>Genero:</p>
                <select id = genero>
                    <option value="H">Hombre</option>
                    <option value="M">Mujer</option>
                    <option value="nano">Fernando Alonso</option>
                    <option value="heli">Helicoptero Apache</option>
                </select>
            </form>
        </main>
    </body>
</html>
